server:
  port: 8080
  # The app runs behind a TLS-terminating proxy chain (CDN -> host nginx ->
  # container nginx -> here, plain HTTP at the origin). Honour
  # X-Forwarded-Proto/Host so OAuth2 redirect URIs come out as
  # https://<your-domain>/... (matching the Google console config)
  # and the session cookie is marked Secure. Must be `native`, not `framework`:
  # framework's ForwardedHeaderFilter only overrides isSecure() for servlet/
  # controller code — Tomcat's own session-cookie creation reads the raw
  # connector-level request state and never sees that override, so the
  # Secure flag silently never got set under `framework` (caught by
  # SecurityConfigTest). `native` configures Tomcat's RemoteIpValve instead,
  # which patches the request at the connector level before Tomcat's own
  # session/cookie logic runs.
  forward-headers-strategy: native
  servlet:
    session:
      # 30 days instead of Boot's 30-minute default: without this, re-opening
      # the installed PWA after any real gap forced a fresh Google sign-in
      # even though the session itself was still perfectly valid.
      timeout: 30d
      cookie:
        same-site: lax
        http-only: true
        max-age: 30d

spring:
  application:
    name: duabiskuttelur
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: jdbc:h2:file:./data/duabiskuttelur;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  session:
    store-type: jdbc
    jdbc:
      # Flyway (V3__spring_session.sql) creates the tables, not Spring
      # Session's own initializer — same reasoning as the Flyway block below.
      initialize-schema: never
  jpa:
    hibernate:
      # Flyway (below) owns schema changes now — validate just checks the
      # entity mappings agree with what the migrations produced, so a missing
      # migration fails fast at startup instead of Hibernate silently patching
      # the schema.
      ddl-auto: validate
    open-in-view: false
  flyway:
    # The V1 baseline documents the schema as it existed under the old
    # ddl-auto:update — on the live DB (which already has those tables)
    # baseline-on-migrate marks V1 as already-applied instead of running it,
    # then later migrations apply normally. A fresh/empty database (new dev
    # machine, rebuilt VM) just runs V1 then everything after it.
    baseline-on-migrate: true
    baseline-version: 1
  security:
    oauth2:
      client:
        registration:
          google:
            # The placeholder default lets the app boot with no OAuth env vars
            # (mock mode for local UI dev, as .env.example documents) — Boot
            # refuses to start on an *empty* client-id. Sign-in just fails at
            # Google until real credentials are set; DuaBiskutTelurApplication
            # logs a startup warning whenever the placeholder is active.
            client-id: ${GOOGLE_CLIENT_ID:local-dev-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-dev-placeholder}
            scope:
              - openid
              - email
              - profile

app:
  # Ordered primary-first: GEMINI_API_KEY is tried first, then the backups on
  # rate limit. Blank entries (unset env vars) are ignored automatically.
  gemini-api-keys:
    - ${GEMINI_API_KEY:}
    - ${GEMINI_API_KEY_2:}
    - ${GEMINI_API_KEY_3:}
  # Preferred model first; the rest are fallbacks used when Google reports the
  # model is overloaded (HTTP 5xx "experiencing high demand") or has retired.
  #
  # Every entry below was verified against the live API on 2026-08-16 with a
  # one-token generateContent call, not just a ListModels lookup: the two are
  # not the same question. gemini-2.5-flash-lite is still *listed* and answers
  # 404 "no longer available to new users" when actually called, which is
  # precisely how it sat in this chain looking like a fallback.
  #
  # Retired and removed from these chains: gemini-2.0-flash,
  # gemini-2.0-flash-lite (both 404 "no longer available") and
  # gemini-2.5-flash-lite. That left the feedback chain with ONE live model
  # behind two corpses.
  #
  # Fallbacks are pinned to versions clearly older than whatever the *-latest
  # aliases currently resolve to. The alias moves on its own schedule and the
  # API does not say where it points, so naming the newest pinned model as its
  # fallback risks a chain whose first two entries are the same model — a
  # fallback that fails in exactly the situation it exists for.
  gemini-vision-models:
    - gemini-flash-latest
    - gemini-3.5-flash
    - gemini-2.5-flash
  gemini-feedback-models:
    - gemini-flash-lite-latest
    - gemini-3.1-flash-lite
    # Not a lite model, deliberately: the only other live lite models are the
    # two the alias above is most likely to already be resolving to. A full
    # flash model costs more tokens, which is the right trade for the last
    # resort on a chain that had no working fallback at all.
    - gemini-2.5-flash
  # Menus deliberately get a SHORTER chain than vision: each attempt may burn the
  # full menu-read-timeout-ms, and models x timeout has to stay under the ~100s
  # proxy ceiling in front of this app (2 x 45s = 90s). A third entry would
  # breach that ceiling, so this list stays at two however many models exist.
  #
  # LITE models, and that is the whole fix for an outage. Menu scans were failing
  # outright: measured on the 30-dish evaluation menu, gemini-flash-latest was
  # returning 503 and gemini-2.5-flash needed ~100s of vision time against a 45s
  # read timeout, so the chain burned both attempts and the budget, and every
  # scan of a full menu ended as a 503. The same menu had taken ~41s when the
  # timings were first measured, so the alias had drifted onto something far
  # heavier underneath us — the standing risk of a *-latest alias on a path with
  # a hard wall-clock ceiling.
  #
  # Timed on that menu, 2026-08-17, one scan each:
  #   gemini-3.5-flash-lite     15.8s   30/30 dishes, not truncated
  #   gemini-flash-lite-latest  15.9s   30/30 dishes, not truncated
  #   gemini-3.1-flash-lite     53.8s   30/30 dishes, not truncated
  #   gemini-3.5-flash          503
  #   gemini-flash-latest       503
  # Reading a menu is extraction and classification, not reasoning, so the lite
  # models lose nothing here: all 30 dishes, no truncation, sensible tiers.
  #
  # Pinned model FIRST, alias second — the opposite of the other chains, on
  # purpose. This path has a hard ceiling and an alias that drifts onto a slower
  # model breaks it outright, which is exactly what happened. Predictability wins
  # here; the alias stays as the safety net for the day the pinned one is retired
  # (a 404 now falls through rather than failing the request).
  #
  # Honest caveat: those two may be the same model today — the timings are within
  # 0.1s of each other. That still buys a retry, which is what a transient 503
  # needs, and it becomes a real fallback the moment the alias moves.
  #
  # Re-time this when menus feel slow. `Menu scan finished in Xms (vision Yms...)`
  # in the backend log is the number that matters.
  gemini-menu-models:
    - gemini-3.5-flash-lite
    - gemini-flash-lite-latest
  # Only the Vite dev server needs a CORS entry — production serves the
  # frontend same-origin behind nginx. Extend (comma-separated) only if the
  # frontend is ever hosted on a different origin than the API.
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  usda-api-key: ${USDA_API_KEY:}
  open-food-facts-base-url: https://world.openfoodfacts.org
  connect-timeout-ms: 10000
  # Per-call cap for plate photos and feedback. Flash models answer these in well
  # under 30s; a hung call must fail fast so the fallback models get a chance
  # within the gateway time budget.
  read-timeout-ms: 30000
  # Menu scans need longer: a higher-resolution image in, and a JSON array of up
  # to 60 dishes out. At 30s these were cut off mid-generation and surfaced as
  # "analyzer is busy" even though the model and every API key were healthy.
  menu-read-timeout-ms: 45000
  # Total wall clock for one Gemini call chain — every model x key attempt plus
  # the backoff sleeps, not per call. Without it the schedule multiplies out to
  # ~18 minutes (4 backoff rounds x 3 models x 3 keys x the 30s read timeout) of
  # a held request thread, long after nginx's proxy_read_timeout (120s) already
  # returned a 504 to the client. Enough of those in flight during a provider
  # outage exhausts Tomcat's thread pool and takes down every other endpoint
  # with it, so this ceiling is what keeps a Gemini incident from becoming an
  # app incident. Vision + feedback below must together stay under that 120s.
  gemini-budget-ms: 60000
  # Feedback gives up sooner than vision on purpose: FeedbackService already
  # falls back to deterministic rule-based text, so a struggling provider
  # shouldn't get the full vision budget a second time for prose that has a
  # working substitute.
  gemini-feedback-budget-ms: 25000
  # The budgets above bound how LONG one call holds a request thread; this
  # bounds how MANY do at once. Both are needed: with a 60s budget and Tomcat's
  # 200 threads, a burst during a provider slowdown still drains the pool and
  # takes sign-in, history and dashboards down with it. Past this limit callers
  # are shed as ANALYZER_BUSY in ~1s and hand their thread straight back, so
  # only requests that actually reached Gemini are holding one. Well above what
  # the free tier's ~15 req/min per key can sustain, so it never throttles
  # healthy traffic — it exists purely as a ceiling.
  # Menus need a bigger ceiling than meals: their per-call timeout is 45s and the
  # chain is two models, so the meal budget would cut the second attempt off
  # before it began. Still inside the ~100s proxy limit.
  gemini-menu-budget-ms: 90000
  gemini-max-concurrent-calls: 16
  # One retry, not two: a USDA failure is usually the service being slow or
  # down, and a menu scan pays this per dish. Genuinely transient blips are rare
  # enough that the second retry cost more latency than it recovered.
  usda-retries: 1
  # USDA gets its own, much shorter read timeout — it used to share the 30s
  # above with Gemini, which is sized for a model writing prose. A keyword
  # search answers in well under a second, and this value is the dominant term
  # in how long a cold menu scan takes.
  usda-read-timeout-ms: 5000
  # Dishes resolved concurrently within one menu scan. Bounded because 60
  # simultaneous lookups would be a burst against a rate-limited third party;
  # serial (the old behaviour) made a cold 60-dish menu outlast the gateway.
  menu-resolve-parallelism: 8
  # Pin each dish's first resolution (NutritionCacheService) so repeat scans of
  # the same dish can't re-roll the USDA-match/model-estimate lottery. Set false
  # to force every scan to resolve afresh — e.g. if a batch of dishes was pinned
  # to model estimates during a USDA outage.
  # Whether a rejected USDA match falls back to a curated local dish table
  # before the model's own estimate. OFF: measured on the 30-dish benchmark it
  # made production rankings worse (rho 0.42-0.58 vs 0.63 without). Re-enable
  # once the validator rejects on per-serving totals rather than per-100g
  # density -- see docs/menu-ranking-evaluation.md.
  # Overridable by env so the A/B can be run without a rebuild, and so it can be
  # switched off in an incident. Note that flipping it only affects dishes
  # resolved *after* the flip: anything already in nutrition_cache replays its
  # pinned answer and never reaches this branch, so a comparison between the two
  # settings is only measuring anything if the cache is cleared in between.
  local-dish-table-enabled: ${LOCAL_DISH_TABLE_ENABLED:false}
  nutrition-cache-enabled: ${NUTRITION_CACHE_ENABLED:true}

# Scoring engine thresholds — every value here is tunable (see ScoringProperties)
scoring:
  daily-calorie-budget: 2000
  fiber-bonus-threshold-grams: 8
  sugar-penalty-threshold-grams: 25
  sodium-penalty-threshold-mg: 800

# Actuator. Reachable only from inside the compose network: the backend port is
# not published to the host, nginx returns 404 for /actuator, and SecurityConfig
# denies everything under /actuator that is not named below. Widening this list
# is therefore not enough on its own to expose an endpoint - both places have to
# change, which is the point.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Default, restated because it is load-bearing: details name the failing
      # component and its exception, and /actuator/health is permitAll.
      show-details: never
  metrics:
    tags:
      application: duabiskuttelur
